<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#121012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PBD POS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&family=Kanit:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E3242B; --red-d:#B5161C; --bg:#121012; --card:#1D191B; --card2:#262124; --line:#352E31;
  --tx:#F6F2F3; --mut:#A99EA2; --ok:#2FBF71; --warn:#F2A93B;
  --r:14px; --nav:62px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
  font:15px/1.45 "IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3,.num{font-family:Kanit,"IBM Plex Sans Thai",sans-serif;font-weight:600;margin:0}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* header */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:rgba(18,16,18,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-family:Kanit;font-weight:600;font-size:18px;letter-spacing:.3px}
.brand b{color:var(--red)}
.teambtn{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--card2);
  border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;max-width:46vw;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:var(--warn)}
.pend{background:var(--warn);color:#111;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}

main{padding:12px 12px calc(var(--nav) + 90px + var(--safe-b))}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);
  height:calc(var(--nav) + var(--safe-b));padding-bottom:var(--safe-b);background:#0C0A0B;border-top:1px solid var(--line)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mut);font-size:12px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--tx)}
nav button.on svg{color:var(--red)}

/* sell */
.searchrow{display:flex;gap:8px;position:sticky;top:58px;z-index:10;background:var(--bg);padding:2px 0 8px}
.search{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
.search:focus{border-color:var(--red)}
.iconbtn{flex:none;width:48px;border-radius:12px;background:var(--red);display:grid;place-items:center;color:#fff}
.iconbtn svg{width:24px;height:24px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-size:13px}
.chip.on{background:var(--tx);color:#111;border-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.item{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.item:active{transform:scale(.98);border-color:var(--red)}
.item .nm{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item .pr{font-family:Kanit;font-size:17px}
.item .pr.zero{color:var(--warn);font-size:13px;font-family:inherit}
.item .q{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:999px;min-width:24px;height:24px;
  display:grid;place-items:center;font-size:13px;font-weight:700;padding:0 6px}

.cartbar{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + var(--safe-b) + 10px);z-index:15;display:flex;
  align-items:center;gap:12px;background:var(--red);color:#fff;border-radius:16px;padding:12px 16px;
  box-shadow:0 8px 24px rgba(227,36,43,.35)}
.cartbar .n{background:rgba(0,0,0,.25);border-radius:999px;padding:2px 10px;font-weight:700}
.cartbar .t{margin-left:auto;font-family:Kanit;font-size:20px}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.mut{color:var(--mut)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 16px;
  background:var(--card2);border:1px solid var(--line);font-weight:600;min-height:46px}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06240f}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
.inp:focus{border-color:var(--red)}
label.f{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600}
.tag.ok{background:rgba(47,191,113,.16);color:var(--ok)}
.tag.wait{background:rgba(242,169,59,.16);color:var(--warn)}
.tag.void{background:rgba(227,36,43,.18);color:#ff7b80}
.tag.err{background:rgba(227,36,43,.18);color:#ff7b80}
.list .li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .v{font-family:Kanit;font-size:22px}
.bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--red)}
.banner{background:rgba(242,169,59,.12);border:1px solid rgba(242,169,59,.4);color:#ffd59a;border-radius:12px;
  padding:10px 12px;margin-bottom:10px;font-size:13px;display:flex;gap:8px;align-items:center}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;
  padding:16px 16px calc(16px + var(--safe-b));border-top:1px solid var(--line)}
.sheet .hd{display:flex;align-items:center;margin-bottom:12px}
.sheet .hd h2{font-size:19px}
.x{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--card2);font-size:20px;line-height:1}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:36px;height:36px;border-radius:10px;background:var(--card2);font-size:20px;font-weight:700}
.qty span{min-width:30px;text-align:center;font-weight:700}
.total{display:flex;align-items:baseline;justify-content:space-between;padding:12px 0;border-top:1px dashed var(--line);margin-top:6px}
.total .num{font-size:28px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.seg button{padding:12px 6px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600}
.seg button.on{background:var(--tx);color:#111;border-color:var(--tx)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.quick button{padding:10px 4px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-weight:600}
.qrbox{background:#fff;border-radius:14px;padding:12px;display:grid;place-items:center;margin:10px auto;max-width:280px}
.qrbox svg,.qrbox img{width:100%;height:auto;display:block}
textarea.inp{resize:vertical;min-height:70px}
.imgpick{display:flex;align-items:center;gap:10px;margin-top:4px}
.imgpick .pv{width:84px;height:84px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.imgpick .pv img{max-width:100%;max-height:100%}
.imgpick .pv.empty{background:var(--card2);color:var(--mut);font-size:12px;text-align:center;padding:6px}
.receipt-prev{background:#fff;border-radius:10px;padding:8px;margin:8px 0;text-align:center}
.receipt-prev canvas{width:100%;max-width:340px;height:auto}
.scanbox{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4}
.scanbox video{width:100%;height:100%;object-fit:cover}
.scanbox .aim{position:absolute;left:12%;right:12%;top:40%;height:20%;border:2px solid var(--red);border-radius:10px;
  box-shadow:0 0 0 999px rgba(0,0,0,.35)}
#scan2{width:100%}

.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kp button{height:64px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font:600 26px Kanit,sans-serif}
.kp button:active{background:var(--line)}
.kp .ok{background:var(--ok);border-color:var(--ok);color:#06240f;font-size:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);z-index:60;
  background:#fff;color:#111;border-radius:12px;padding:10px 16px;font-weight:600;max-width:90vw;
  box-shadow:0 10px 30px rgba(0,0,0,.4);text-align:center}
.toast.err{background:var(--red);color:#fff}

.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.login .logo{width:84px;height:84px;border-radius:22px}
.linebtn{background:#06C755;color:#fff;border-radius:14px;padding:14px 22px;font-weight:700;font-size:16px;min-width:260px}
</style>
</head>
<body>
<div id="login" class="login hidden">
  <img class="logo" src="icon-192.png" alt="">
  <div>
    <h1 style="font-size:24px">PBD <span style="color:var(--red)">POS</span></h1>
    <div class="mut">ขายหน้างาน · ทำงานได้แม้เน็ตหลุด</div>
  </div>
  <button class="linebtn" id="loginBtn">เข้าสู่ระบบด้วย LINE</button>
  <div class="mut small" id="loginMsg"></div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">PBD <b>POS</b></div>
    <span id="pend" class="pend hidden"></span>
    <button class="teambtn" id="teamBtn"><span class="dot" id="netDot"></span><span id="teamName">-</span></button>
  </header>
  <main id="view"></main>
  <div id="cartbar" class="cartbar hidden" role="button">
    <span class="n" id="cartN">0</span><span>ตะกร้า</span><span class="t num" id="cartT">฿0</span>
  </div>
  <nav id="nav">
    <button data-v="sell" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L22 7H6.2"/></svg>ขาย</button>
    <button data-v="bills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h14v20l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>บิล</button>
    <button data-v="shift"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>กะ/เงินสด</button>
    <button data-v="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15v3M12 10v8M17 6v12"/></svg>รายงาน</button>
    <button data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>ตั้งค่า</button>
  </nav>
</div>

<div id="sheetHost"></div>
<div id="toastHost"></div>

<script src="config.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="app.js"></script>
</body>
</html>
